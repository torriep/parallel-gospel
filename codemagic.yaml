workflows:
  ios-testflight:
    name: iOS — TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Admin
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6762166162
        BUNDLE_ID: "com.pierreroberge.parallelgospel"
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Fix bundle ID in pbxproj
        script: |
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          /usr/bin/sed -i '' 's/com\.pierreroberge\.evangeleparallele/com.pierreroberge.parallelgospel/g' "$PBX"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PBX" | head -3
      - name: Set build number from Codemagic build counter
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Set up signing
        script: |
          set -e
          # Generate a fresh private key just for this build
          openssl genrsa -out /tmp/cm-private-key 2048

          keychain initialize

          # Create a NEW cert on Apple's side bound to our private key
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:/tmp/cm-private-key \
            --save

          # Now fetch profiles (cert exists now, so this works)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cm-private-key \
            --create

          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

          echo "=== Signing settings in pbxproj ==="
          grep -E "(CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|PRODUCT_BUNDLE)" "ios/App/App.xcodeproj/project.pbxproj" | sort -u || true
      - name: Archive iOS app
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
